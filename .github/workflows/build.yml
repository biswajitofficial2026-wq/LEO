name: Build LEO App
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        
      - name: Unzip Source Code
        run: |
          unzip *.zip
          rm *.zip
          
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Build APK
        run: |
          PROJECT_ROOT=$(dirname $(find . -name "gradlew" | head -n 1))
          cd $PROJECT_ROOT
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LEO-APK
          path: "**/*.apk"
          
